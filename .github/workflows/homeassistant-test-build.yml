name: Build Home Assistant cooking methods test

on:
  push:
    branches:
      - homeassistant-testing
    paths:
      - ha-addon/**
      - .github/workflows/homeassistant-test-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homeassistant-testing-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out test add-on
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build timestamp
        id: build-date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish the ARM64 test image
        uses: docker/build-push-action@v7
        with:
          context: ./ha-addon
          file: ./ha-addon/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/midnightcache/mealie-homeassistant-test:3.28.0-test.d8c5037
          cache-from: type=gha,scope=mealie-homeassistant-test-arm64
          cache-to: type=gha,mode=max,scope=mealie-homeassistant-test-arm64
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            BUILD_DESCRIPTION=Test cooking method variants with separate Mealie data
            BUILD_NAME=Mealie Test (Cooking Methods)
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=3.28.0-test.d8c5037
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=d8c5037f3afc6db8f2680a64606bbd49fdba39dd
